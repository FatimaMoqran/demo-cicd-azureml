name: Test connexion Azure
on:
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
jobs:
  connexion:
    runs-on: ubuntu-latest
    steps:
      - name: Se connecter a Azure (sans mot de passe)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Installer l'extension Azure ML
        run: az extension add -n ml
      - name: Lister les workspaces Azure ML
        run: az ml workspace list -g rg-iwid-fatima -o table
