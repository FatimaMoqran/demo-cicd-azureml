name: CI - verification du code
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4
      - name: Installer Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Installer les bibliotheques
        run: pip install -r requirements.txt
      - name: Verifier le style du code (flake8)
        run: flake8 src tests --max-line-length=100
      - name: Lancer les tests (pytest)
        run: pytest tests -v
        env:
          PYTHONPATH: src
